<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/fav1.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>404 · Page Not Found · SwiftParcel</title>
  <script src="tailwind.js"></script>
  <style>

    /* ================================================================
       MODERN CLEAN PALETTE
       ================================================================ */
    :root, html[data-theme='light'] {
      --color-background: #FFFFFF;
      --color-primary-text: #1A2A3A;
      --color-secondary-text: #5A6E7F;
      --color-accent: #1E6F9F;
      --color-accent-2: #F59E0B;
      --color-accent-light: #EAF3FA;
      --color-border: #D9E2EC;
      --color-hover: #F2F7FC;
      --card-bg: #FFFFFF;
      --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
      --shadow-lg: 0 16px 48px rgba(0,0,0,0.08);
      --gradient-accent: linear-gradient(135deg, #1E6F9F 0%, #14547A 100%);
      --gradient-accent-soft: linear-gradient(135deg, rgba(30,111,159,0.08) 0%, rgba(20,84,122,0.04) 100%);
      --gradient-warm: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
    }
    html[data-theme='dark'] {
      --color-background: #121A22;
      --color-primary-text: #E8F0F8;
      --color-secondary-text: #9FB2C2;
      --color-accent: #4A9ED9;
      --color-accent-2: #FBBF24;
      --color-accent-light: #1B2A38;
      --color-border: #2C3E4E;
      --color-hover: #1D2A36;
      --card-bg: #1A242E;
      --shadow-md: 0 8px 24px rgba(0,0,0,0.35);
      --shadow-lg: 0 16px 48px rgba(0,0,0,0.45);
      --gradient-accent: linear-gradient(135deg, #4A9ED9 0%, #2E7AB5 100%);
      --gradient-accent-soft: linear-gradient(135deg, rgba(74,158,217,0.10) 0%, rgba(46,122,181,0.05) 100%);
      --gradient-warm: linear-gradient(135deg, #FBBF24 0%, #D97706 100%);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background-color: var(--color-background);
      color: var(--color-primary-text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      transition: background-color 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      line-height: 1.6;
    }

    h1, h2, h3, h4, h5, h6 { font-weight: 500 !important; margin: 0; }
    p { margin: 0; font-weight: 400 !important; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ================================================================
       ANIMATED BACKGROUND GLOWS
       ================================================================ */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #1E6F9F, transparent 70%);
      top: -150px; right: -100px;
      animation: floatOrb 16s ease-in-out infinite;
    }
    .glow-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #F59E0B, transparent 70%);
      bottom: -120px; left: -100px;
      animation: floatOrb 20s ease-in-out infinite reverse;
    }
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.08); }
      66% { transform: translate(-30px, 20px) scale(0.95); }
    }
    
    /* ================================================================
       FLOATING PARTICLES
       ================================================================ */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .particle {
      position: absolute;
      width: 5px; height: 5px;
      background: var(--color-accent);
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    .particle:nth-child(1) { left: 8%;  animation-duration: 16s; animation-delay: 0s;   }
    .particle:nth-child(2) { left: 24%; animation-duration: 20s; animation-delay: 3s;  width: 4px; height: 4px; }
    .particle:nth-child(3) { left: 46%; animation-duration: 14s; animation-delay: 1s;  }
    .particle:nth-child(4) { left: 68%; animation-duration: 22s; animation-delay: 4s;  width: 7px; height: 7px; }
    .particle:nth-child(5) { left: 82%; animation-duration: 18s; animation-delay: 2s;  }
    .particle:nth-child(6) { left: 94%; animation-duration: 15s; animation-delay: 5s;  width: 4px; height: 4px; }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }

    /* ================================================================
       404 CONTENT
       ================================================================ */
    .error-wrap {
      position: relative;
      z-index: 5;
      max-width: 620px;
      width: 100%;
      padding: 40px 24px;
      text-align: center;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Brand logo ── */
    .brand {
      display: inline-flex; align-items: center; gap: 12px;
      margin-bottom: 32px;
      padding: 8px 20px 8px 10px;
      background: var(--card-bg);
      border: 1px solid var(--color-border);
      border-radius: 9999px;
      box-shadow: var(--shadow-md);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .brand:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    .brand-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--gradient-accent);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 18px;
      box-shadow: 0 6px 16px rgba(30, 111, 159, 0.35);
    }
    .brand-text {
      font-size: 20px; font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--color-primary-text);
    }
    .brand-text span { color: var(--color-accent); }

    /* ── Big 404 ── */
    .error-code {
      font-size: 130px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -6px;
      margin-bottom: 8px;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      display: inline-block;
      animation: pulse404 4s ease-in-out infinite;
    }
    @media (min-width: 640px) { .error-code { font-size: 180px; letter-spacing: -8px; } }
    @media (min-width: 1024px) { .error-code { font-size: 210px; letter-spacing: -10px; } }
    @keyframes pulse404 {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* ── Truck icon overlay on 404 ── */
    .error-icon-badge {
      display: inline-flex;
      align-items: center; justify-content: center;
      width: 68px; height: 68px;
      border-radius: 20px;
      background: var(--gradient-warm);
      color: white;
      font-size: 28px;
      box-shadow: 0 12px 32px rgba(245, 158, 11, 0.35);
      margin-bottom: 26px;
      animation: bounceIcon 3s ease-in-out infinite;
    }
    @keyframes bounceIcon {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }

    /* ── Headline ── */
    .error-title {
      font-size: 26px;
      font-weight: 800 !important;
      letter-spacing: -0.6px;
      color: var(--color-primary-text);
      margin-bottom: 14px;
      line-height: 1.2;
    }
    @media (min-width: 640px) { .error-title { font-size: 34px; } }
    @media (min-width: 1024px) { .error-title { font-size: 38px; } }

    .error-desc {
      font-size: 15.5px;
      line-height: 1.7;
      color: var(--color-secondary-text);
      max-width: 480px;
      margin: 0 auto 32px;
    }
    @media (min-width: 640px) { .error-desc { font-size: 16.5px; } }

    /* ── Buttons ── */
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 24px; min-height: 46px; min-height: 46px;
      border-radius: 12px;
      background: var(--gradient-accent);
      color: white;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 6px 20px rgba(30, 111, 159, 0.30);
      transition: all 0.3s ease;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(30, 111, 159, 0.40);
      color: white;
    }
    .btn-primary i {
      font-size: 14px;
      transition: transform 0.3s ease;
    }
    .btn-primary:hover i { transform: translateX(3px); }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 24px; min-height: 46px;
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--color-primary-text);
      font-weight: 700;
      font-size: 15px;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-ghost:hover {
      transform: translateY(-3px);
      border-color: var(--color-accent);
      color: var(--color-accent);
      box-shadow: var(--shadow-lg);
    }
    .btn-ghost i { font-size: 14px; }

    /* ── Helpful links ── */
    .helpful-links {
      padding-top: 28px;
      border-top: 1px solid var(--color-border);
    }
    .helpful-label {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--color-secondary-text);
      margin-bottom: 16px;
    }
    .helpful-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .helpful-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: var(--color-hover);
      border: 1px solid var(--color-border);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--color-primary-text);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .helpful-link:hover {
      background: var(--gradient-accent);
      color: white;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(30, 111, 159, 0.25);
    }
    .helpful-link i {
      font-size: 13px;
      color: var(--color-accent);
      transition: color 0.25s ease;
    }
    .helpful-link:hover i { color: white; }

    /* ── Theme toggle (floating) ── */
    .theme-toggle {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--color-border);
      color: var(--color-secondary-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
      z-index: 100;
      cursor: pointer;
    }
    .theme-toggle:hover {
      color: var(--color-accent);
      border-color: var(--color-accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    @media (max-width: 640px) {
      .theme-toggle { top: 16px; right: 16px; width: 40px; height: 40px; font-size: 14px; }
    }

    /* ── Responsive tweaks ── */
    @media (max-width: 640px) {
      .error-code { font-size: 110px; letter-spacing: -4px; }
      .error-icon-badge { width: 58px; height: 58px; font-size: 24px; border-radius: 17px; }
      .error-wrap { padding: 32px 20px; }
      .btn-primary, .btn-ghost { padding: 12px 22px; font-size: 14px; }
      .helpful-link { padding: 9px 14px; font-size: 12.5px; }
      .glow { opacity: 0.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    ::-webkit-scrollbar { display: none; }
    html { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</head>
<body>

  <!-- Animated background glows -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- Floating particles -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- Floating theme toggle -->
  <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
    <i class="fa-solid fa-moon light-icon"></i>
    <i class="fa-solid fa-sun dark-icon" style="display: none;"></i>
  </button>

  <!-- ================================================================
       404 ERROR CONTENT
       ================================================================ -->
  <main class="error-wrap">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-truck-fast"></i></div>
      <div class="brand-text">Swift<span>Parcel</span></div>
    </div>

    <!-- Icon badge -->
    <div class="error-icon-badge">
      <i class="fa-solid fa-box-open"></i>
    </div>

    <!-- Big 404 -->
    <div class="error-code">404</div>

    <!-- Headline -->
    <h1 class="error-title">This parcel went missing</h1>

    <!-- Description -->
    <p class="error-desc">
      Looks like the page you're looking for has been delivered elsewhere — or never existed. Don't worry, our couriers are on it.
    </p>

    <!-- Actions -->
    <div class="error-actions">
      <a href="index.html" class="btn-primary">
        <i class="fa-solid fa-house"></i>
        Back to Home
      </a>
      <a href="contact.html" class="btn-ghost">
        <i class="fa-solid fa-headset"></i>
        Contact Support
      </a>
    </div>

    <!-- Helpful links -->
    <div class="helpful-links">
      <div class="helpful-label">Popular destinations</div>
      <div class="helpful-grid">
        <a href="services.html" class="helpful-link">
          <i class="fa-solid fa-truck-fast"></i> Services
        </a>
        <a href="pricing.html" class="helpful-link">
          <i class="fa-solid fa-calculator"></i> Rate Calculator
        </a>
        <a href="userdash.html" class="helpful-link">
          <i class="fa-solid fa-location-crosshairs"></i> Track Shipment
        </a>
        <a href="login.html" class="helpful-link">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </a>
      </div>
    </div>

  </main>

  <!-- ================================================================
       THEME TOGGLE SCRIPT
       ================================================================ -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const html = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const lightIcon = toggle.querySelector('.light-icon');
      const darkIcon = toggle.querySelector('.dark-icon');

      const applyTheme = (theme) => {
        html.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          lightIcon.style.display = 'none';
          darkIcon.style.display = 'inline-block';
        } else {
          lightIcon.style.display = 'inline-block';
          darkIcon.style.display = 'none';
        }
      };

      // Load saved theme
      const savedTheme = localStorage.getItem('theme') || 'light';
      applyTheme(savedTheme);

      // Toggle on click
      toggle.addEventListener('click', () => {
        const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        localStorage.setItem('theme', next);
        applyTheme(next);
      });
    });
  </script>
</body>
</html>
